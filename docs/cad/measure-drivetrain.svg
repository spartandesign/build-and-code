<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Two engineering views of a drive base showing the three numbers a smart drivetrain needs. A top view labels the track width — the distance between the left and right wheels, measured center to center. A side view labels the wheel base — the distance between the front and back wheels — and the wheel diameter, marked with the diameter symbol, about 101.6 millimetres for a 4 inch wheel. A rule states that one wheel turn moves the robot a distance equal to pi times the wheel diameter, so a 4 inch wheel travels about 319 millimetres, and that track width and wheel base are measured in millimetres on your own robot.">
  <defs>
    <marker id="mdim" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1F3864"/></marker>
    <marker id="mdimL" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#1F3864"/></marker>
    <marker id="mlead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6470"/></marker>
  </defs>

  <!-- ===================== TOP VIEW (track width) ===================== -->
  <text x="40" y="48" font-family="Arial" font-size="13" font-weight="bold" fill="#1F3864">TOP VIEW</text>
  <text x="40" y="65" font-family="Arial" font-size="11.5" fill="#5B6470">looking straight down</text>

  <!-- chassis -->
  <rect x="120" y="78" width="170" height="150" rx="7" fill="#F2F7FC" stroke="#5B6470" stroke-width="1.3"/>
  <!-- four wheels (top view = thin treads, rolling front-to-back) -->
  <g fill="#2A3340" stroke="#1A1A1A" stroke-width="1">
    <rect x="113" y="90"  width="14" height="40" rx="3"/>
    <rect x="113" y="176" width="14" height="40" rx="3"/>
    <rect x="283" y="90"  width="14" height="40" rx="3"/>
    <rect x="283" y="176" width="14" height="40" rx="3"/>
  </g>
  <!-- centre marks on the two wheels used for track width -->
  <line x1="120" y1="196" x2="120" y2="266" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="290" y1="196" x2="290" y2="266" stroke="#1F3864" stroke-width="0.6"/>
  <!-- track-width dimension -->
  <line x1="120" y1="258" x2="290" y2="258" stroke="#1F3864" stroke-width="1" marker-start="url(#mdimL)" marker-end="url(#mdim)"/>
  <rect x="158" y="249" width="94" height="17" fill="#fff"/>
  <text x="205" y="261" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1F3864">track width</text>
  <text x="205" y="284" text-anchor="middle" font-family="Arial" font-size="11" fill="#5B6470">left wheel ↔ right wheel</text>

  <!-- divider -->
  <line x1="380" y1="60" x2="380" y2="300" stroke="#BFC7D2" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===================== SIDE VIEW (wheel base + diameter) ===================== -->
  <text x="430" y="48" font-family="Arial" font-size="13" font-weight="bold" fill="#1F3864">SIDE VIEW</text>
  <text x="430" y="65" font-family="Arial" font-size="11.5" fill="#5B6470">looking from the side</text>

  <!-- chassis slab -->
  <rect x="470" y="96" width="180" height="56" rx="5" fill="#F2F7FC" stroke="#5B6470" stroke-width="1.3"/>
  <!-- back &amp; front wheels (side view = circles) -->
  <g>
    <circle cx="505" cy="176" r="34" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/>
    <circle cx="505" cy="176" r="9"  fill="#2A3340"/>
    <circle cx="615" cy="176" r="34" fill="#fff" stroke="#1A1A1A" stroke-width="1.6"/>
    <circle cx="615" cy="176" r="9"  fill="#2A3340"/>
  </g>
  <text x="505" y="232" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#5B6470">back</text>
  <text x="615" y="232" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#5B6470">front</text>

  <!-- wheel-base dimension -->
  <line x1="505" y1="176" x2="505" y2="262" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="615" y1="176" x2="615" y2="262" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="505" y1="254" x2="615" y2="254" stroke="#1F3864" stroke-width="1" marker-start="url(#mdimL)" marker-end="url(#mdim)"/>
  <rect x="513" y="245" width="94" height="17" fill="#fff"/>
  <text x="560" y="257" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1F3864">wheel base</text>

  <!-- wheel-diameter dimension on the front wheel -->
  <line x1="615" y1="142" x2="615" y2="210" stroke="#C55A11" stroke-width="1" marker-start="url(#mdimL)" marker-end="url(#mdim)"/>
  <line x1="660" y1="176" x2="628" y2="176" stroke="#5B6470" stroke-width="0.7" marker-end="url(#mlead)"/>
  <rect x="662" y="167" width="92" height="18" fill="#fff"/>
  <text x="666" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#C55A11">Ø ≈ 101.6 mm</text>
  <text x="666" y="198" font-family="Arial" font-size="10.5" fill="#5B6470">(a 4 in wheel)</text>

  <!-- ===================== RULE ===================== -->
  <line x1="40" y1="312" x2="720" y2="312" stroke="#C55A11" stroke-width="1"/>
  <text x="40" y="333" font-family="Arial" font-size="12.5" fill="#1A1A1A"><tspan font-weight="bold" fill="#C55A11">RULE:</tspan>  one wheel turn moves the robot <tspan font-weight="bold" fill="#1F3864">wheel travel = π × Ø</tspan>.  A 4 in wheel → π × 101.6 ≈ <tspan font-weight="bold">319 mm</tspan>.</text>
  <text x="40" y="351" font-family="Arial" font-size="12.5" fill="#1A1A1A">Measure <tspan font-weight="bold" fill="#1F3864">track width</tspan> and <tspan font-weight="bold" fill="#1F3864">wheel base</tspan> center-to-center, in mm, on YOUR robot.</text>
</svg>
