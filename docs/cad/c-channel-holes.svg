<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Technical drawing of a VEX C-channel beam face showing a row of holes spaced one half inch center to center, the standard VEX hole pitch">
  <defs>
    <marker id="cdim" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1F3864"/></marker>
    <marker id="cdimL" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#1F3864"/></marker>
    <marker id="clead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6470"/></marker>
  </defs>

  <!-- beam face outline -->
  <rect x="70" y="110" width="580" height="70" fill="#F2F7FC" stroke="#5B6470" stroke-width="1.3"/>
  <!-- row of holes, 9 holes at 60px spacing = 0.5" each at this scale -->
  <g fill="#fff" stroke="#1A1A1A" stroke-width="1.1">
    <circle cx="100" cy="145" r="11"/>
    <circle cx="160" cy="145" r="11"/>
    <circle cx="220" cy="145" r="11"/>
    <circle cx="280" cy="145" r="11"/>
    <circle cx="340" cy="145" r="11"/>
    <circle cx="400" cy="145" r="11"/>
    <circle cx="460" cy="145" r="11"/>
    <circle cx="520" cy="145" r="11"/>
    <circle cx="580" cy="145" r="11"/>
    <circle cx="620" cy="145" r="11"/>
  </g>
  <!-- centerline through holes -->
  <line x1="70" y1="145" x2="650" y2="145" stroke="#5B6470" stroke-width="0.6" stroke-dasharray="9 3 2 3"/>

  <!-- single-pitch dimension between first two holes -->
  <line x1="100" y1="145" x2="100" y2="220" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="160" y1="145" x2="160" y2="220" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="100" y1="212" x2="160" y2="212" stroke="#1F3864" stroke-width="1" marker-start="url(#cdimL)" marker-end="url(#cdim)"/>
  <rect x="104" y="203" width="52" height="16" fill="#fff"/>
  <text x="130" y="215" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1F3864">0.50″</text>

  <!-- overall note: count holes -->
  <line x1="100" y1="145" x2="100" y2="86" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="620" y1="145" x2="620" y2="86" stroke="#1F3864" stroke-width="0.6"/>
  <line x1="100" y1="94" x2="620" y2="94" stroke="#1F3864" stroke-width="1" marker-start="url(#cdimL)" marker-end="url(#cdim)"/>
  <rect x="300" y="85" width="120" height="16" fill="#fff"/>
  <text x="360" y="97" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1F3864">9 spaces = 4.50″</text>

  <!-- hole leader -->
  <line x1="340" y1="156" x2="360" y2="250" stroke="#5B6470" stroke-width="0.7" marker-end="url(#clead)"/>
  <text x="364" y="253" font-family="Arial" font-size="12" fill="#5B6470">mounting hole (fits #8-32 screw)</text>

  <!-- pitch rule note -->
  <text x="70" y="276" font-family="Arial" font-size="12.5" fill="#1A1A1A"><tspan font-weight="bold" fill="#1F3864">RULE:</tspan>  VEX holes are 1 pitch = 0.50″ apart, center-to-center. Beam length = (number of spaces) × 0.50″.</text>
</svg>
