<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="A schematic map of the VEX EXP Brain ports. Ten numbered Smart Ports (1 to 10) run along the top and bottom edges and take Smart Cable devices: the Smart Motor, Distance Sensor, and Optical Sensor. Eight lettered 3-Wire ports (A to H) run down the right side and take the Bumper Switch and Potentiometer V2. The Inertial Sensor is built into the Brain with no port. A rule says to name each device in code to match the port it is plugged into.">
  <defs>
    <marker id="bp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6470"/></marker>
  </defs>

  <!-- ===== Brain body ===== -->
  <rect x="232" y="150" width="372" height="210" rx="14" fill="#F2F7FC" stroke="#1F3864" stroke-width="2"/>

  <!-- LCD screen -->
  <rect x="255" y="183" width="150" height="120" rx="5" fill="#DCE6F2" stroke="#5B6470" stroke-width="1.2"/>
  <text x="330" y="248" text-anchor="middle" font-family="Arial" font-size="12" fill="#5B6470">screen</text>

  <!-- Check / X buttons -->
  <circle cx="448" cy="205" r="14" fill="#E2EFDA" stroke="#1F3864" stroke-width="1.3"/>
  <path d="M441 205 L446 211 L456 198" fill="none" stroke="#1F3864" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="210" font-family="Arial" font-size="11.5" fill="#1A1A1A">on</text>
  <circle cx="448" cy="248" r="14" fill="#fff" stroke="#1F3864" stroke-width="1.3"/>
  <path d="M442 242 L454 254 M454 242 L442 254" fill="none" stroke="#C55A11" stroke-width="2.6" stroke-linecap="round"/>
  <text x="470" y="253" font-family="Arial" font-size="11.5" fill="#1A1A1A">off</text>

  <!-- Inertial built-in chip -->
  <rect x="430" y="280" width="150" height="48" rx="6" fill="#FBEFD6" stroke="#C55A11" stroke-width="1.2"/>
  <text x="505" y="300" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1F3864">Inertial Sensor</text>
  <text x="505" y="316" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#1A1A1A">built in &#183; no port</text>

  <!-- ===== Smart Ports: top row 1-5 ===== -->
  <g font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">
    <rect x="270" y="138" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="285" y="155">1</text>
    <rect x="320" y="138" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="335" y="155">2</text>
    <rect x="370" y="138" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="385" y="155">3</text>
    <rect x="420" y="138" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="435" y="155">4</text>
    <rect x="470" y="138" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="485" y="155">5</text>
  </g>
  <!-- ===== Smart Ports: bottom row 6-10 ===== -->
  <g font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">
    <rect x="270" y="348" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="285" y="365">6</text>
    <rect x="320" y="348" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="335" y="365">7</text>
    <rect x="370" y="348" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="385" y="365">8</text>
    <rect x="420" y="348" width="30" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="435" y="365">9</text>
    <rect x="464" y="348" width="36" height="24" rx="3" fill="#fff" stroke="#1F3864" stroke-width="1.3"/><text x="482" y="365">10</text>
  </g>

  <!-- ===== 3-Wire Ports A-H, right side ===== -->
  <g font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#4B4DA6" text-anchor="middle">
    <rect x="592" y="158" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="174">A</text>
    <rect x="592" y="183" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="199">B</text>
    <rect x="592" y="208" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="224">C</text>
    <rect x="592" y="233" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="249">D</text>
    <rect x="592" y="258" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="274">E</text>
    <rect x="592" y="283" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="299">F</text>
    <rect x="592" y="308" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="324">G</text>
    <rect x="592" y="333" width="24" height="22" rx="3" fill="#fff" stroke="#4B4DA6" stroke-width="1.3"/><text x="604" y="349">H</text>
  </g>

  <!-- ===== Labels / leaders ===== -->
  <!-- Smart ports label (top) -->
  <text x="120" y="96" font-family="Arial" font-size="14" font-weight="bold" fill="#1F3864">Smart Ports (1&#8211;10, numbered)</text>
  <text x="120" y="114" font-family="Arial" font-size="12" fill="#1A1A1A">Smart Motor &#183; Distance &#183; Optical &#8212; a Smart Cable, pressed until it clicks</text>
  <line x1="300" y1="120" x2="360" y2="138" stroke="#5B6470" stroke-width="1.1" marker-end="url(#bp)"/>

  <!-- 3-wire label (right) -->
  <text x="640" y="234" font-family="Arial" font-size="14" font-weight="bold" fill="#4B4DA6">3-Wire Ports</text>
  <text x="640" y="252" font-family="Arial" font-size="14" font-weight="bold" fill="#4B4DA6">(A&#8211;H, lettered)</text>
  <text x="640" y="272" font-family="Arial" font-size="12" fill="#1A1A1A">Bumper Switch</text>
  <text x="640" y="288" font-family="Arial" font-size="12" fill="#1A1A1A">Potentiometer V2</text>
  <text x="640" y="304" font-family="Arial" font-size="11" fill="#5B6470">keyed &#8212; one way in</text>
  <line x1="636" y1="244" x2="620" y2="244" stroke="#5B6470" stroke-width="1.1" marker-end="url(#bp)"/>

  <!-- ===== Rule ===== -->
  <line x1="40" y1="430" x2="820" y2="430" stroke="#C55A11" stroke-width="1"/>
  <text x="40" y="452" font-family="Arial" font-size="13" fill="#1A1A1A"><tspan font-weight="bold" fill="#C55A11">RULE:</tspan>  name each device in code to match the port it is plugged into.</text>
  <text x="40" y="474" font-family="Consolas, monospace" font-size="12.5" fill="#1F3864">motor leftMotor = motor(PORT1);   bumper hit = bumper(Brain.ThreeWirePort.A);</text>
</svg>
