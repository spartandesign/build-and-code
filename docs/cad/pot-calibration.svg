<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="An arm pivots on a Potentiometer V2. A dashed line marks the home position, the baseline captured at startup. The solid arm is raised, and the angle between home and the arm is labelled angle from home. A rule states: capture the raw reading once at home as the baseline, then the arm's angle from home equals the raw reading minus the baseline, because the sensor's own zero is wherever it was mounted.">
  <defs>
    <marker id="pdim" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1F3864"/></marker>
    <marker id="pdimL" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#1F3864"/></marker>
  </defs>

  <!-- home (baseline) arm: dashed ghost -->
  <line x1="200" y1="205" x2="452" y2="205" stroke="#5B6470" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="452" cy="205" r="4" fill="#5B6470"/>
  <text x="462" y="201" font-family="Arial" font-size="12.5" font-weight="bold" fill="#5B6470">home position</text>
  <text x="462" y="217" font-family="Arial" font-size="11.5" fill="#5B6470">(the baseline)</text>

  <!-- raised arm: solid navy, with a small load block -->
  <line x1="200" y1="205" x2="329" y2="40" stroke="#1F3864" stroke-width="7" stroke-linecap="round"/>
  <rect x="319" y="30" width="22" height="22" rx="3" transform="rotate(-52 330 41)" fill="#C55A11" stroke="#1A1A1A" stroke-width="1"/>
  <text x="350" y="44" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1F3864">arm now</text>

  <!-- angle arc from home (0 deg) to arm (52 deg) -->
  <path d="M 300 205 A 100 100 0 0 0 261.6 126.2" fill="none" stroke="#1F3864" stroke-width="1.6" marker-start="url(#pdimL)" marker-end="url(#pdim)"/>
  <rect x="300" y="150" width="116" height="17" fill="#fff"/>
  <text x="305" y="163" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1F3864">angle from home</text>

  <!-- pivot: the potentiometer -->
  <circle cx="200" cy="205" r="26" fill="#F2F7FC" stroke="#5B6470" stroke-width="1.4"/>
  <circle cx="200" cy="205" r="9" fill="#2A3340"/>
  <text x="200" y="252" text-anchor="middle" font-family="Arial" font-size="12" fill="#5B6470">Potentiometer V2 (the pivot)</text>

  <!-- rule -->
  <line x1="40" y1="266" x2="660" y2="266" stroke="#C55A11" stroke-width="1"/>
  <text x="40" y="285" font-family="Arial" font-size="12.5" fill="#1A1A1A"><tspan font-weight="bold" fill="#C55A11">RULE:</tspan>  capture the raw reading once at home (the <tspan font-weight="bold" fill="#1F3864">baseline</tspan>), then <tspan font-weight="bold" fill="#1F3864">angle from home = raw − baseline</tspan>.</text>
</svg>
