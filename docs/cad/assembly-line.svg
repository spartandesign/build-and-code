<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288" role="img" aria-label="A simulated assembly line. A part enters at the left and flows right through three automated workcells — Workcell 1 stamps, Workcell 2 drills, Workcell 3 ejects — then exits as a finished part at the right. Each cell senses the part, runs its process, and passes it on. Orange hand-off arrows between cells mark where teams must coordinate so the part transitions smoothly.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6470"/></marker>
    <marker id="ho" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C55A11"/></marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1F3864">ONE PART, MANY CELLS — A SIMULATED ASSEMBLY LINE</text>
  <text x="380" y="46" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#5B6470">each team builds one automated workcell; together the cells hand the part down the line</text>

  <!-- IN -->
  <text x="14" y="120" font-family="Arial" font-size="10.5" font-weight="bold" letter-spacing="1" fill="#5B6470">PART</text>
  <text x="14" y="133" font-family="Arial" font-size="10.5" font-weight="bold" letter-spacing="1" fill="#5B6470">IN</text>
  <line x1="44" y1="126" x2="74" y2="126" stroke="#5B6470" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- Workcell 1 (navy) -->
  <rect x="80" y="80" width="160" height="96" rx="12" fill="#1F3864"/>
  <text x="160" y="104" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#9DC3E6">WORKCELL 1</text>
  <text x="160" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF">Stamp</text>
  <text x="160" y="154" text-anchor="middle" font-family="Arial" font-size="11" fill="#DEEAF6">sense → run → pass</text>

  <!-- hand-off 1->2 -->
  <text x="270" y="100" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#C55A11">hand-off</text>
  <line x1="242" y1="128" x2="296" y2="128" stroke="#C55A11" stroke-width="2.6" marker-end="url(#ho)"/>

  <!-- Workcell 2 (blue) -->
  <rect x="300" y="80" width="160" height="96" rx="12" fill="#F2F7FC" stroke="#2E75B6" stroke-width="1.8"/>
  <text x="380" y="104" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2E75B6">WORKCELL 2</text>
  <text x="380" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1A1A1A">Drill</text>
  <text x="380" y="154" text-anchor="middle" font-family="Arial" font-size="11" fill="#1A1A1A">sense → run → pass</text>

  <!-- hand-off 2->3 -->
  <text x="490" y="100" text-anchor="middle" font-family="Arial" font-size="10.5" font-weight="bold" fill="#C55A11">hand-off</text>
  <line x1="462" y1="128" x2="516" y2="128" stroke="#C55A11" stroke-width="2.6" marker-end="url(#ho)"/>

  <!-- Workcell 3 (green) -->
  <rect x="520" y="80" width="160" height="96" rx="12" fill="#E2EFDA" stroke="#3F6B2A" stroke-width="1.8"/>
  <text x="600" y="104" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#3F6B2A">WORKCELL 3</text>
  <text x="600" y="130" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1A1A1A">Eject</text>
  <text x="600" y="154" text-anchor="middle" font-family="Arial" font-size="11" fill="#1A1A1A">sense → run → pass</text>

  <!-- OUT -->
  <line x1="682" y1="126" x2="712" y2="126" stroke="#5B6470" stroke-width="2.4" marker-end="url(#arr)"/>
  <text x="718" y="120" font-family="Arial" font-size="10.5" font-weight="bold" letter-spacing="1" fill="#3F6B2A">DONE</text>

  <text x="380" y="214" text-anchor="middle" font-family="Arial" font-size="12.5" fill="#1F3864" font-weight="bold">Each cell is a Chapter 11 automatic behavior. The new challenge is making them work together.</text>
  <text x="380" y="238" text-anchor="middle" font-family="Arial" font-size="11.5" font-style="italic" fill="#5B6470">The orange hand-offs are where teams must agree: where the part arrives, how it sits, and when to run.</text>
</svg>
